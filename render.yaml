services:
  - type: web
    name: calpeo-seo-api
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        value: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - key: INITIAL_ADMIN_EMAIL
        value: admin@calpeo.io
      - key: INITIAL_ADMIN_PASSWORD
        value: Admin12345!
      - key: DATABASE_URL
        fromDatabase:
          name: calpeo-seo-db
          property: connectionString

databases:
  - name: calpeo-seo-db
    plan: free
    region: frankfurt
    databaseName: calpeo_db
    user: postgres
