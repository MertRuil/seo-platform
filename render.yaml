        value: CalpeoAdmin2026!
      # Live Supabase PostgreSQL Connection (Async & Sync)
      - key: DATABASE_URL
        value: postgresql+asyncpg://postgres.wlrrdasqofpewvjtfkgs:CINHct6Og9WwuRQVckcF4PqQ@aws-0-eu-central-1.pooler.supabase.com:5432/postgres
      - key: DATABASE_SYNC_URL
        value: postgresql://postgres.wlrrdasqofpewvjtfkgs:CINHct6Og9WwuRQVckcF4PqQ@aws-0-eu-central-1.pooler.supabase.com:5432/postgres
