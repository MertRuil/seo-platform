# Alembic Environment Configuration for Autonomous AI SEO Platform

[alembic]
# Path to migration scripts
script_location = infra/migrations

# Prepend current directory to sys.path so modules can be imported
prepend_sys_path = .

# Default database connection URL (overridden dynamically in env.py from settings)
sqlalchemy.url = postgresql://postgres:postgrespassword@localhost:5432/autonomous_seo_db

# Output encoding
output_encoding = utf-8

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
